<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Operador</title>
<style>
  :root {
    --laranja: #FF4F00;
    --fundo: #0A0A0F;
    --superficie: #131318;
    --superficie-alta: #1C1C24;
    --borda: rgba(255,255,255,0.08);
    --texto: #F4F4F6;
    --suave: #8B8B96;
    --ambar: #E8A33D;
    --verde: #4FB477;
    --mono: ui-monospace, 'Cascadia Mono', Menlo, 'Courier New', monospace;
    --raio: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--fundo); color: var(--texto);
    font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
    font-size: 15px; line-height: 1.55;
    padding: 24px 16px 72px; -webkit-font-smoothing: antialiased;
  }
  .folha { max-width: 1020px; margin: 0 auto; }

  /* ── Marca ── */
  .marca {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 26px;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--suave);
  }
  .marca b { color: var(--laranja); font-weight: 800; }

  /* ── Meta ── */
  .meta {
    background: var(--superficie); border: 1px solid var(--borda);
    border-radius: var(--raio); padding: 22px 20px; margin-bottom: 14px;
  }
  .meta-topo {
    display: flex; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; gap: 8px; margin-bottom: 16px;
  }
  .rotulo { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--suave); }
  .meta-valor { font-family: var(--mono); font-size: clamp(24px, 6vw, 32px); font-weight: 600; letter-spacing: -.02em; }
  .meta-valor small { font-size: 15px; color: var(--suave); font-weight: 400; }
  .barra { height: 6px; background: var(--superficie-alta); border-radius: 99px; overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 99px; background: var(--laranja); }
  .meta-nota { margin-top: 14px; font-size: 14px; color: var(--suave); }
  .meta-nota b { color: var(--texto); font-weight: 600; }

  /* ── Colunas ── */
  .colunas { display: grid; gap: 14px; }
  @media (min-width: 840px) { .colunas { grid-template-columns: 1fr 1fr; align-items: start; } }

  .coluna {
    background: var(--superficie); border: 1px solid var(--borda);
    border-radius: var(--raio); padding: 22px 20px;
  }
  .coluna.direita {
    border-color: rgba(232,163,61,0.22);
    background: linear-gradient(180deg, rgba(232,163,61,0.05) 0%, var(--superficie) 60%);
  }
  .coluna h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; margin-bottom: 3px; }
  .coluna.esquerda h2 { color: var(--verde); }
  .coluna.direita h2 { color: var(--ambar); }
  .sub { font-size: 13px; color: var(--suave); margin-bottom: 18px; }

  ul { list-style: none; }
  li { display: flex; align-items: flex-start; gap: 11px; padding: 11px 0; border-top: 1px solid var(--borda); font-size: 14px; }
  li:first-child { border-top: 0; }
  .ponto { flex: 0 0 auto; margin-top: 6px; width: 7px; height: 7px; border-radius: 50%; }
  .ponto.feito { background: var(--verde); }
  .ponto.aberto { border: 1.5px solid var(--ambar); }
  .txt { flex: 1 1 auto; min-width: 0; }
  .txt a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--borda); }
  .txt a:hover { border-color: var(--laranja); }
  .quando { display: block; font-size: 12px; color: var(--suave); margin-top: 2px; }
  .conta { flex: 0 0 auto; font-family: var(--mono); font-size: 13px; color: var(--suave); }
  .conta.alerta { color: var(--ambar); }
  .conta.ok { color: var(--verde); }
  .vazio { font-size: 14px; color: var(--suave); padding: 8px 0; }

  /* ── Índice ── */
  .indice { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--borda); }
  .indice-topo { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .indice-num { font-family: var(--mono); font-size: 26px; font-weight: 600; }
  .causa { font-size: 14px; color: var(--suave); margin-top: 12px; }
  .causa b { color: var(--texto); font-weight: 600; }
  .acao { font-size: 14px; margin-top: 5px; }
  .faixa { font-size: 12px; color: var(--suave); margin-top: 10px; }

  /* ── FeraBots ── */
  .sec { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
         color: var(--suave); margin: 40px 0 14px; }
  .bots { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 620px) { .bots { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) { .bots { grid-template-columns: 1fr 1fr 1fr; } }
  .bot {
    background: var(--superficie); border: 1px solid var(--borda);
    border-radius: 13px; padding: 16px 16px 14px;
    transition: border-color .15s, background .15s;
  }
  .bot:hover { border-color: rgba(255,79,0,.3); background: var(--superficie-alta); }
  .bot h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .bot p { font-size: 12.5px; color: var(--suave); line-height: 1.45; margin-bottom: 12px; }
  .linha-cmd { display: flex; align-items: center; gap: 7px; }
  .cmd {
    flex: 1 1 auto; min-width: 0; font-family: var(--mono); font-size: 12.5px;
    color: var(--laranja); background: rgba(255,79,0,.1); border: 1px solid rgba(255,79,0,.18);
    padding: 6px 10px; border-radius: 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: all;
  }
  .copiar {
    flex: 0 0 auto; background: var(--superficie-alta); border: 1px solid var(--borda);
    border-radius: 7px; padding: 6px 10px; font-size: 11.5px; color: var(--suave);
    cursor: pointer; font-family: inherit;
  }
  .copiar:hover { color: var(--laranja); border-color: rgba(255,79,0,.3); }
  .copiar.ok { color: var(--verde); border-color: rgba(79,180,119,.35); }

  .porta {
    background: linear-gradient(135deg, rgba(255,79,0,.12) 0%, var(--superficie) 65%);
    border: 1px solid rgba(255,79,0,.3);
    border-radius: var(--raio); padding: 20px; margin-top: 14px;
  }
  .porta h3 { font-size: 16px; margin-bottom: 5px; }
  .porta p { font-size: 13.5px; color: var(--suave); margin-bottom: 14px; }

  .rodape {
    margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--borda);
    font-size: 12.5px; color: var(--suave); text-align: center;
  }
  .rodape code { font-family: var(--mono); color: var(--texto); }
  .rodape a { color: var(--suave); text-decoration: none; margin: 0 10px; }
  .rodape a:hover { color: var(--laranja); }

  .aviso {
    background: var(--superficie); border: 1px solid rgba(255,79,0,.3);
    border-radius: var(--raio); padding: 30px 22px; text-align: center;
  }
  .aviso h1 { font-size: 19px; margin-bottom: 10px; }
  .aviso p { color: var(--suave); font-size: 14px; margin-bottom: 12px; }
  .aviso code {
    display: block; max-width: 380px; margin: 6px auto; font-family: var(--mono);
    font-size: 13px; background: var(--superficie-alta); padding: 8px 12px;
    border-radius: 8px; color: var(--texto);
  }
</style>
</head>
<body>
<div class="folha" id="folha"></div>

<script src="painel.js" onerror="window.PAINEL=null"></script>
<script>
(function () {
  var folha = document.getElementById('folha');
  var P = window.PAINEL || null;

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function brl(v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 }); }
  function quando(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' +
           d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  var BOTS = [
    ['Copiloto de Gestão', 'Metas, painel, relatório da semana e o gargalo do momento.', '/copiloto-de-gestao'],
    ['Propostas', 'PDF de proposta comercial pronto pra mandar pro cliente.', '/propostas'],
    ['Páginas & Quiz', 'Landing, página de venda e quiz. Com deploy.', '/paginas-e-quiz'],
    ['Conteúdo & Anúncios', 'Anúncios, carrossel, stories, posts e campanha.', '/conteudo-e-anuncios'],
    ['Roteiros & Oratória', 'Roteiro, vídeo, YouTube e slides.', '/roteiros-e-oratoria'],
    ['CRM de Leads', 'Captura de lead, disparo de WhatsApp e comentário pra DM.', '/crm-de-leads']
  ];

  function blocoBots() {
    return '<div class="porta">' +
        '<h3>Comece por aqui</h3>' +
        '<p>Um comando só. Ele mentora, e chama o FeraBot certo quando você pede uma peça.</p>' +
        '<div class="linha-cmd">' +
          '<span class="cmd">/fera</span>' +
          '<button class="copiar" data-cmd="/fera">Copiar</button>' +
        '</div>' +
      '</div>' +
      '<div class="sec">Os 6 FeraBots</div>' +
      '<div class="bots">' + BOTS.map(function (b) {
        return '<div class="bot"><h3>' + esc(b[0]) + '</h3><p>' + esc(b[1]) + '</p>' +
          '<div class="linha-cmd"><span class="cmd">' + esc(b[2]) + '</span>' +
          '<button class="copiar" data-cmd="' + esc(b[2]) + '">Copiar</button></div></div>';
      }).join('') + '</div>';
  }

  function ligarCopia() {
    Array.prototype.forEach.call(document.querySelectorAll('.copiar'), function (btn) {
      btn.addEventListener('click', function () {
        var texto = btn.getAttribute('data-cmd');
        function feedback() {
          var antes = btn.textContent;
          btn.textContent = 'Copiado';
          btn.classList.add('ok');
          setTimeout(function () { btn.textContent = antes; btn.classList.remove('ok'); }, 1800);
        }
        if (navigator.clipboard) {
          navigator.clipboard.writeText(texto).then(feedback, function () {});
          return;
        }
        var campo = document.createElement('textarea');
        campo.value = texto;
        document.body.appendChild(campo);
        campo.select();
        try { document.execCommand('copy'); feedback(); } catch (e) {}
        document.body.removeChild(campo);
      });
    });
  }

  // ── Sem dados: manda rodar o setup ──────────────────────────
  if (!P) {
    folha.innerHTML =
      '<div class="marca"><b>FERA</b><span>Painel do Operador</span></div>' +
      '<div class="aviso">' +
        '<h1>Painel ainda não gerado</h1>' +
        '<p>Roda os dois comandos abaixo no terminal, nessa ordem, e recarrega a página.</p>' +
        '<code>python SetupFera/setup_metas.py</code>' +
        '<code>python ScriptsFera/metas-api.py painel</code>' +
      '</div>' + blocoBots();
    ligarCopia();
    return;
  }

  var fat = P.faturamento || {};
  var exe = P.execucao || {};
  var perfil = P.perfil || {};

  if (perfil.cor_primaria) {
    document.documentElement.style.setProperty('--laranja', perfil.cor_primaria);
  }

  // ── Meta ────────────────────────────────────────────────────
  var html =
    '<div class="marca"><b>FERA</b><span>' + esc(perfil.nome || 'Painel do Operador') + '</span></div>' +
    '<div class="meta">' +
      '<div class="meta-topo">' +
        '<span class="rotulo">Meta do mês</span>' +
        '<span class="meta-valor">' + brl(fat.entrou) + ' <small>de ' + brl(fat.alvo) + '</small></span>' +
      '</div>' +
      '<div class="barra"><i style="width:' + Math.min(100, fat.percentual || 0) + '%"></i></div>' +
      '<p class="meta-nota">' +
        (fat.falta > 0
          ? 'Faltam <b>' + brl(fat.falta) + '</b> e restam <b>' + fat.dias_restantes + ' dias</b>' +
            (fat.vendas_faltando ? '. São <b>' + fat.vendas_faltando + ' venda(s)</b>.' : '.')
          : 'Meta do mês batida.') +
      '</p>' +
    '</div>';

  // ── Coluna esquerda ─────────────────────────────────────────
  var entregas = P.entregas || [];
  var esquerda = entregas.length
    ? '<ul>' + entregas.map(function (e) {
        var corpo = esc(e.descricao);
        if (e.link && /^https?:/i.test(e.link)) {
          corpo = '<a href="' + esc(e.link) + '" target="_blank" rel="noopener">' + corpo + ' &#8599;</a>';
        }
        return '<li><span class="ponto feito"></span><span class="txt">' + corpo +
          '<span class="quando">' + esc(e.bot) + ' &middot; ' + quando(e.data) + '</span></span></li>';
      }).join('') + '</ul>'
    : '<p class="vazio">Nada entregue ainda. Chama <b>/fera</b> e pede a primeira peça.</p>';

  // ── Coluna direita ──────────────────────────────────────────
  var itens = exe.itens || [];
  var direita = itens.length
    ? '<ul>' + itens.map(function (i) {
        var completo = i.proporcao >= 1;
        var classe = completo ? 'ok' : (i.proporcao === 0 ? 'alerta' : '');
        return '<li><span class="ponto ' + (completo ? 'feito' : 'aberto') + '"></span>' +
          '<span class="txt">' + esc(i.rotulo) + '</span>' +
          '<span class="conta ' + classe + '">' + esc(i.texto) + '</span></li>';
      }).join('') + '</ul>'
    : '<p class="vazio">Nenhum compromisso definido. Roda <b>setup_metas.py</b>.</p>';

  // Regra do coach: o número nunca aparece sozinho. Sempre com causa e ação.
  var g = exe.gargalo;
  var indice =
    '<div class="indice">' +
      '<div class="indice-topo">' +
        '<span class="rotulo">Índice de execução</span>' +
        '<span class="indice-num">' + (exe.indice != null ? exe.indice : 0) + '</span>' +
      '</div>' +
      '<div class="barra"><i style="width:' + (exe.indice || 0) + '%;background:var(--ambar)"></i></div>' +
      (g
        ? '<p class="causa">O que puxou pra baixo: <b>' + esc(g.rotulo) + '</b> &middot; ' + esc(g.texto) + '</p>' +
          '<p class="acao">Fechar isso ainda essa semana levanta o índice.</p>'
        : '<p class="causa">Todos os compromissos da semana estão em dia.</p>') +
      (exe.saudavel ? '' : '<p class="faixa">A faixa saudável começa em 80. Não precisa ser 100.</p>') +
    '</div>';

  html +=
    '<div class="colunas">' +
      '<section class="coluna esquerda"><h2>Pronto e no ar</h2>' +
        '<p class="sub">O que os FeraBots já construíram</p>' + esquerda + '</section>' +
      '<section class="coluna direita"><h2>Só anda se você andar</h2>' +
        '<p class="sub">Irredutível seu, cerca de 2h por dia</p>' + direita + indice + '</section>' +
    '</div>' +
    blocoBots() +
    '<div class="rodape">' +
      '<p>Atualizado em ' + esc(quando(P.gerado_em)) + ' &middot; ' +
        'para atualizar rode <code>python ScriptsFera/metas-api.py painel</code></p>' +
      '<p style="margin-top:10px">' +
        '<a href="../PRIMEIRO_DIA.md" target="_blank">Guia do primeiro dia</a>' +
        '<a href="../API_SETUP.md" target="_blank">Chaves de API</a>' +
      '</p>' +
    '</div>';

  folha.innerHTML = html;
  ligarCopia();
})();
</script>
</body>
</html>
